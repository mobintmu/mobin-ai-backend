[project]
name = "mobin-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "cryptography==46.0.1",
    "email-validator==2.3.0",
    "fastapi==0.118.0",
    "httpx==0.28.1",
    "pgvector==0.4.1",
    "phonenumbers==9.0.15",
    "prometheus-client==0.23.1",
    "psycopg[binary]==3.2.10",
    "pydantic-settings==2.11.0",
    "sqlalchemy==2.0.43",
    "uvicorn==0.37.0",
]
[dependency-groups]
dev = ["mypy==1.18.2", "pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.2"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
